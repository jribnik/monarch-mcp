# source: HAND-WRITTEN read-only query (not a capture, not catalog-exported):
#   merchant list/search, used by update_merchant's duplicate-name pre-check to
#   give a clear error when another merchant already has the target name.
# NOT authoritative. See operations/README.md.

query Common_SearchMerchantsByName($search: String, $limit: Int, $offset: Int) {
  merchants(search: $search, limit: $limit, offset: $offset) {
    id
    name
    transactionCount
    __typename
  }
}
