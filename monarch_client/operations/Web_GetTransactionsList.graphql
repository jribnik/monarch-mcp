query Web_GetTransactionsList($offset: Int, $limit: Int, $filters: TransactionFilterInput, $orderBy: TransactionOrdering) {
  allTransactions(filters: $filters) {
    totalCount
    totalSelectableCount
    results(offset: $offset, limit: $limit, orderBy: $orderBy) {
      id
      ...TransactionOverviewFields
      __typename
    }
    __typename
  }
  transactionRules {
    id
    __typename
  }
}

fragment TransactionOverviewFields on Transaction {
  id
  amount
  pending
  date
  hideFromReports
  hiddenByAccount
  plaidName
  notes
  isRecurring
  reviewStatus
  needsReview
  isSplitTransaction
  dataProviderDescription
  deletedAt
  deletedByType
  needsReviewByUser {
    id
    __typename
  }
  attachments {
    id
    __typename
  }
  goal {
    id
    name
    __typename
  }
  isLinkedToPaydownBudget
  savingsGoalEvent {
    id
    goal {
      id
      name
      __typename
    }
    __typename
  }
  category {
    id
    name
    icon
    systemCategory
    group {
      id
      type
      __typename
    }
    __typename
  }
  merchant {
    name
    id
    transactionCount
    logoUrl
    defaultCategoryApplicationMode
    showDefaultCategoryPrompt
    defaultCategory {
      id
      name
      icon
      __typename
    }
    recurringTransactionStream {
      frequency
      isActive
      __typename
    }
    __typename
  }
  tags {
    id
    name
    color
    order
    __typename
  }
  account {
    id
    displayName
    icon
    logoUrl
    linkedGoal {
      id
      name
      __typename
    }
    __typename
  }
  ownedByUser {
    id
    displayName
    profilePictureUrl
    __typename
  }
  businessEntity {
    id
    name
    logoUrl
    color
    __typename
  }
  __typename
}
