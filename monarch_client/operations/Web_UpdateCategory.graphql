mutation Web_UpdateCategory($input: UpdateCategoryInput!) {
  updateCategory(input: $input) {
    errors {
      ...PayloadErrorFields
      __typename
    }
    category {
      id
      ...CategoryFormFields
      __typename
    }
    __typename
  }
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
    __typename
  }
  message
  code
  __typename
}

fragment CategoryFormFields on Category {
  id
  order
  name
  icon
  systemCategory
  systemCategoryDisplayName
  budgetVariability
  excludeFromBudget
  isSystemCategory
  isDisabled
  isProtected
  group {
    id
    type
    groupLevelBudgetingEnabled
    __typename
  }
  rolloverPeriod {
    id
    startMonth
    startingBalance
    type
    frequency
    targetAmount
    __typename
  }
  __typename
}
